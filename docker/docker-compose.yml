# ──────────────────────────────────────────────────
# Person Blog — Docker Compose (Development)
# ──────────────────────────────────────────────────

services:
  # ── PostgreSQL 16 ──────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: blog_db
    environment:
      POSTGRES_DB: blog_db
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: blog_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_user -d blog_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis 7 ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: blog_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Django Backend ─────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: blog_backend
    environment:
      - DATABASE_URL=psql://blog_user:blog_password@db:5432/blog_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - SECRET_KEY=change-me-in-production-use-a-real-secret-key
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Worker ──────────────────────────────
  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: blog_celery_worker
    command: celery -A config worker -l info -E --concurrency=4
    environment:
      - DATABASE_URL=psql://blog_user:blog_password@db:5432/blog_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - SECRET_KEY=change-me-in-production-use-a-real-secret-key
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Beat Scheduler ──────────────────────
  celery_beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: blog_celery_beat
    command: celery -A config beat -l info
    environment:
      - DATABASE_URL=psql://blog_user:blog_password@db:5432/blog_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - SECRET_KEY=change-me-in-production-use-a-real-secret-key
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

# ── Named Volumes ────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_data:
    driver: local
  static_data:
    driver: local
